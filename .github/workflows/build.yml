name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c

      - name: Build and package
        run: |
          xmake f -y -p android -a arm64-v8a -m release --ndk=${{ steps.ndk.outputs.ndk-path }}
          xmake -y

      - name: Prepare artifacts
        run: |
          DIR=artifacts
          mkdir -p "$DIR"
          cp build/android/arm64-v8a/release/LeviBatone.levipack "$DIR/"
          cp build/android/arm64-v8a/release/liblevibatone.so "$DIR/"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"

      - name: Upload artifact (push / PR builds)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: LeviBatone-${{ env.SHORT_SHA }}
          path: artifacts/*
          if-no-files-found: error

      - name: Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: LeviBatone ${{ github.ref_name }} (${{ env.SHORT_SHA }})
          body: |
            Automated release for tag `${{ github.ref_name }}`, built from commit ${{ github.sha }}.

            Target: Minecraft 1.26.60 (arm64-v8a), LeviLauncher native mod (`preload-native`).

            Install via LeviLauncher: Mods → Add Mod → import `LeviBatone.levipack`.
          files: artifacts/*
          fail_on_unmatched_files: true
